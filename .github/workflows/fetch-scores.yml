name: Fetch Live Scores

on:
  schedule:
    - cron: '* * * * *'   # every minute during tournament
  workflow_dispatch:       # manual trigger button too

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch scores from API-Football
        run: |
          curl -s \
            -H "x-apisports-key: ${{ secrets.APIFOOTBALL_KEY }}" \
            "https://v3.football.api-sports.io/fixtures?league=1&season=2026" \
            > scores.json

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scores.json
          git diff --staged --quiet || git commit -m "Update scores"
          git push
