name: Fetch Live Scores

on:
  schedule:
    - cron: '* * * * *'   # every minute
  workflow_dispatch:       # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch scores from API-Football
        run: |
          curl -s \
            -H "x-apisports-key: ${{ secrets.APIFOOTBALL_KEY }}" \
            "https://v3.football.api-sports.io/fixtures?league=1&season=2026" \
            -o scores.json
          echo "Fetched $(cat scores.json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("response",[])))') fixtures"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          git diff --staged --quiet || git commit -m "chore: update scores $(date -u +'%H:%M UTC')"
          git push
