name: Fetch Live Scores

on:
  schedule:
    - cron: '*/2 * * * *'   # every 2 minutes
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch scores from worldcup26.ir
        run: |
          curl -s "https://worldcup26.ir/get/games" -o scores.json
          echo "Fetched $(cat scores.json | python3 -c 'import json,sys; d=json.load(sys.stdin); matches=d if isinstance(d,list) else d.get("data",d.get("matches",[])); print(len(matches))' 2>/dev/null || echo '?') matches"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          git diff --staged --quiet || git commit -m "chore: update scores $(date -u +'%H:%M UTC')"
          git push
